name: Loading Portal V2 — exact Drawer assets bootstrap
on:
  push:
    branches: [feat/loading-portal-v2-lab]
    paths:
      - '.github/workflows/loading-portal-v2-assets-bootstrap.yml'
      - 'scripts/build_loading_portal_v2_mechanical.py'
permissions:
  contents: write
jobs:
  exact-drawer-assets:
    if: github.ref == 'refs/heads/feat/loading-portal-v2-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loading-portal-v2-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact source encoder versions
        run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - name: Generate and require exact approved SHA-256 and pixel recomposition
        run: |
          python scripts/build_loading_portal_v2_mechanical.py
          python scripts/build_loading_portal_v2_mechanical.py --check
      - name: Commit only validated approved WebP assets to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/home/loading-portal/loading-portal-base-4x3.webp public/assets/home/loading-portal/mechanical
          if ! git diff --cached --quiet; then
            git commit -m "assets(portal): reproduce all 21 Drawer mechanical WebPs and 4x3 reference byte-for-byte"
            git push origin HEAD:refs/heads/feat/loading-portal-v2-lab
          fi
