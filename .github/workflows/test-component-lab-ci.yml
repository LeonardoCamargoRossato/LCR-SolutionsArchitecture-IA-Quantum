name: LCR Test Component Lab V1 — Build, Browser & Performance

on:
  push:
    branches: [feat/test-component-lab-v1]
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - 'code/vite.config.ts'
      - 'code/src/RootRouteGate.tsx'
      - 'code/src/PortfolioExperience.tsx'
      - 'code/src/main.tsx'
      - 'code/src/pages/TestComponentLab.tsx'
      - 'code/src/features/test-component-lab/**'
      - 'code/src/components/test-component-lab/**'
      - 'code/tests/test-component-lab-smoke.mjs'
      - '.github/workflows/test-component-lab-ci.yml'
      - 'code/docs/test-component-lab/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  verify-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript and Vite production build
        run: bash tests/isolation/run.sh npm run build
      - name: Check route splitting, scope and rendering safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gate = Path('src/RootRouteGate.tsx').read_text()
          renderer = Path('src/components/test-component-lab/particle-wave/ParticleWave.tsx').read_text()
          config = Path('src/components/test-component-lab/particle-wave/particle-wave-types.ts').read_text()
          lab = Path('src/pages/TestComponentLab.tsx').read_text()
          assert "lazy(() => import('./PortfolioExperience'))" in gate, 'Portfolio runtime not isolated'
          assert "import('./pages/TestComponentLab')" in gate, 'Lab route missing lazy loading'
          assert "location.pathname === '/test-component-lab'" in gate, 'Lab hash route missing'
          assert 'requestAnimationFrame' in renderer and 'cancelAnimationFrame' in renderer, 'Renderer lifecycle missing'
          assert 'IntersectionObserver' in renderer and 'visibilitychange' in renderer, 'Offscreen/hidden pause missing'
          assert 'ResizeObserver' in renderer, 'Responsive renderer missing'
          assert 'Math.min(safe.particleCount, isMobile ? 1700 : 4200)' in renderer, 'Particle cap missing'
          assert '4200' in config, 'Particle limit not defined'
          assert 'useEffect' in lab and 'clearTimeout' in lab, 'Particle count debounce missing'
          assert 'supabase' not in renderer.lower() and 'fetch(' not in renderer, 'Remote rendering dependency detected'
          dist = Path('dist/assets')
          assert list(dist.glob('TestComponentLab-*.js')), 'Lab did not receive its own lazy bundle'
          assert list(dist.glob('PortfolioExperience-*.js')), 'Portfolio must stay route-split'
          print('PASS isolated lazy routes, particle caps, cleanup, no remote deps')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke tests — Lab and unchanged Home
        run: bash tests/isolation/run.sh node tests/test-component-lab-smoke.mjs
      - name: Upload desktop/mobile/screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-test-component-lab-v1-evidence
          path: code/test-results/
          retention-days: 30
          if-no-files-found: warn
