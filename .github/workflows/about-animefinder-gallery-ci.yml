name: LCR Portfolio - About and AnimeFinder gallery regression

on:
  push:
    branches:
      - feat/about-gallery-animefinder-screenshots-20261122
      - feat/animefinder-real-gallery-assets-20261122
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - 'code/vite.config.ts'
      - code/src/**
      - code/tests/about-gallery-credentials-smoke.mjs
      - .github/workflows/about-animefinder-gallery-ci.yml
      - code/docs/assets/**
      - code/public/assets/projects/animefinder/**
      - code/tests/animefinder-asset-integrity.test.mjs
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify 16 original PNGs, 16 WebPs and SHA-256 inventory
        run: bash tests/isolation/run.sh node tests/animefinder-asset-integrity.test.mjs
      - name: Typecheck and build
        run: bash tests/isolation/run.sh npm run build
      - name: About gallery media resolver regression
        run: bash tests/isolation/run.sh node tests/about-gallery-media.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: About + LACQ + education + 16:9 gallery + AnimeFinder cover
        run: bash tests/isolation/run.sh node tests/about-gallery-credentials-smoke.mjs
      - name: Existing carousel regression (all project cases)
        run: bash tests/isolation/run.sh node tests/portfolio-carousel-unified-smoke.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-about-animefinder-gallery
          path: code/test-results/
          if-no-files-found: warn
          retention-days: 30
