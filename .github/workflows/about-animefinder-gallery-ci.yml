name: LCR Portfolio - About and AnimeFinder gallery regression

on:
  push:
    branches:
      - feat/about-gallery-animefinder-screenshots-20261122
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/about-gallery-credentials-smoke.mjs
      - .github/workflows/about-animefinder-gallery-ci.yml
      - docs/assets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_MEDIA_BUCKET: ${{ secrets.VITE_SUPABASE_MEDIA_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: About gallery media resolver regression
        run: node tests/about-gallery-media.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: About + LACQ + education + 16:9 gallery + AnimeFinder cover
        run: node tests/about-gallery-credentials-smoke.mjs
      - name: Existing carousel regression (all project cases)
        run: node tests/portfolio-carousel-unified-smoke.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-about-animefinder-gallery
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
