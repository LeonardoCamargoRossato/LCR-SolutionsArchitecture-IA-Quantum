name: LCR Hero V13 — Lab Particle Wave and V12 Bilingual Regression

on:
  push:
    branches: [feat/hero-v13-lab-particle-wave-20261123]
  pull_request:
    branches: [main]
    paths:
      - 'tests/isolation/**'
      - 'vite.config.ts'
      - src/components/hero/**
      - src/components/test-component-lab/particle-wave/**
      - src/config/heroParticleWave.ts
      - src/config/portfolioPositioning.ts
      - src/data/defaultContent.ts
      - src/data/defaultProjects.ts
      - src/i18n/**
      - src/pages/**
      - src/components/ProjectCard.tsx
      - src/components/case/CaseHero.tsx
      - src/components/SeoSync.tsx
      - src/components/WorkflowManual.tsx
      - src/App.tsx
      - tests/hero-v11-responsive-i18n-smoke.mjs
      - tests/hero-v12-composition-smoke.mjs
      - tests/hero-v13-particle-wave-smoke.mjs
      - src/components/Header.tsx
      - src/components/header/**
      - src/i18n/**
      - src/providers/ThemeProvider.tsx
      - src/styles/global.css
      - index.html
      - tests/hero-v10-header-smoke.mjs
      - src/pages/Home.tsx
      - src/config/portfolioPositioning.ts
      - src/main.tsx
      - tests/hero-v5-smoke.mjs
      - tests/hero-mobile-v9-layout-smoke.mjs
      - public/assets/home/hero/**
      - tests/ai-positioning-smoke.mjs
      - .github/workflows/hero-v2-ci.yml
      - docs/hero-v5/**
      - docs/hero-v6/**
      - docs/hero-v7/**
      - docs/hero-v8/**
      - docs/hero-v9/**
      - docs/hero-v10/**
      - docs/hero-v11/**
      - docs/hero-v12/**
      - docs/hero-v13/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: TypeScript and production Vite build
        run: bash tests/isolation/run.sh npm run build
      - name: Check Hero visual asset/code budgets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/components/hero')
          files = sorted(p for p in src.rglob('*') if p.is_file())
          total = sum(p.stat().st_size for p in files)
          print(f'Hero component/source bytes: {total:,} across {len(files)} files')
          assert total < 75_000, 'Hero source grew unexpectedly'
          assert not list(Path('src/components/hero').rglob('*.png')), 'No large images in interactive SVG hero'
          assert not list(Path('src/components/hero').rglob('*.mp4')), 'No video in interactive SVG hero'
          assert not list(Path('src/components/hero').rglob('*.webm')), 'No video in interactive SVG hero'
          from gzip import compress
          svg = Path('public/assets/home/hero/lcr-hero-blue-code-v7-lite.svg')
          data = svg.read_bytes()
          compressed = len(compress(data, compresslevel=9))
          print(f'Optimized STATIC SVG: {len(data):,} bytes source / {compressed:,} bytes gzip')
          assert len(data) < 220_000, 'Optimized SVG source budget exceeded'
          assert compressed < 28_000, 'Optimized SVG gzip transfer budget exceeded'
          assert b'<animateMotion' not in data and b'animation:' not in data, 'Continuous SVG rasterization detected'
          assert data.count(b'<text ') < 2000, 'Glyph density regression'
          light = Path('public/assets/home/hero/lcr-hero-blue-code-v8-light-navy.svg')
          light_data = light.read_bytes()
          light_gzip = len(compress(light_data, compresslevel=9))
          print(f'Light navy SVG: {len(light_data):,} bytes source / {light_gzip:,} bytes gzip')
          assert len(light_data) < 220_000 and light_gzip < 28_000, 'Light SVG transfer budget exceeded'
          assert light_data.count(b'<text ') == data.count(b'<text '), 'Light theme must retain identical perspective detail'
          assert b'<animateMotion' not in light_data and b'animation:' not in light_data, 'Expensive motion added to light SVG'
          assert b'<script' not in light_data and b'<foreignObject' not in light_data, 'Unsafe SVG markup'
          PY
      - name: Install Chromium for browser tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate theme-specific SVG contrast, 4 Hero tags, performance and 3 scenes
        run: bash tests/isolation/run.sh node tests/hero-v5-smoke.mjs
      - name: V11 responsive and public bilingual route regression
        run: bash tests/isolation/run.sh node tests/hero-v11-responsive-i18n-smoke.mjs
      - name: V12 three-scene navigation, readable left-aligned tags, compact controls and raised desktop neural view
        run: bash tests/isolation/run.sh node tests/hero-v12-composition-smoke.mjs
      - name: V13 shared Lab particle Canvas, reference geometry, original SVG, pause and reduced motion
        run: bash tests/isolation/run.sh node tests/hero-v13-particle-wave-smoke.mjs
      - name: Mobile two-line headline, compact gap, Hamlet AI label (9 responsive viewports)
        run: bash tests/isolation/run.sh node tests/hero-mobile-v9-layout-smoke.mjs
      - name: Header flags, English/dark defaults, desktop tags and mobile scene clearance
        run: bash tests/isolation/run.sh node tests/hero-v10-header-smoke.mjs
      - name: Existing Home/SEO/projects regression
        run: bash tests/isolation/run.sh node tests/ai-positioning-smoke.mjs
      - name: Browser evidence (desktop, notebook, tablet, mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-hero-v13-browser-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
