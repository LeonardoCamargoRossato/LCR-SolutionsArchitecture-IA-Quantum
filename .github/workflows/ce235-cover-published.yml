name: LCR isolated manual regression — ce235-cover-published

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-ce235:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published CE235 card, first screenshot and PNG zoom
        run: bash tests/isolation/run.sh node tests/ce235-cover-browser-smoke.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce235-published-cover-evidence
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
