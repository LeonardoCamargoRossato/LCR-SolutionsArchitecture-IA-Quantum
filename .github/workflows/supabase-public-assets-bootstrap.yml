name: Bootstrap approved public asset copy

on:
  push:
    branches:
      - feat/supabase-public-assets-copy

permissions:
  contents: write

concurrency:
  group: supabase-public-assets-bootstrap
  cancel-in-progress: false

jobs:
  copy-verified-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-public-assets-copy

      - name: Download and verify approved public objects
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          inventory_path = pathlib.Path("docs/assets/supabase-public-assets-inventory.json")
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          entries = [item for item in inventory["assets"] if item["status"] == "copied"]
          expected_count = inventory["summary"]["github_new_file_count"]
          expected_bytes = inventory["summary"]["github_new_bytes"]
          if len(entries) != expected_count:
              raise SystemExit(f"Inventory count mismatch: {len(entries)} != {expected_count}")

          root = pathlib.Path.cwd().resolve()
          base_url = "https://wdjffhfnzydudmhhekmk.supabase.co/storage/v1/object/public/portfolio-media/"

          def fetch(item):
              source = item["supabase_path"]
              target_name = item["github_path"]
              if not source or source.startswith("/") or ".." in pathlib.PurePosixPath(source).parts:
                  raise ValueError(f"Unsafe source path: {source!r}")
              target = (root / target_name).resolve()
              if not target.is_relative_to(root):
                  raise ValueError(f"Unsafe destination: {target_name!r}")
              url = base_url + urllib.parse.quote(source, safe="/")
              request = urllib.request.Request(url, headers={"User-Agent": "LCR-public-assets-copy/1"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item["size_bytes"] or digest != item["sha256"]:
                  raise ValueError(f"Integrity mismatch for {source}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return len(data)

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              sizes = list(executor.map(fetch, entries))
          copied_bytes = sum(sizes)
          if copied_bytes != expected_bytes:
              raise SystemExit(f"Inventory byte count mismatch: {copied_bytes} != {expected_bytes}")
          print(f"Verified {len(entries)} objects ({copied_bytes} bytes) against SHA-256 inventory.")
          PY
          git diff --check

      - name: Commit files to the migration branch
        run: |
          rm .github/workflows/supabase-public-assets-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: copy approved public Supabase media"
          git push origin HEAD:refs/heads/feat/supabase-public-assets-copy
