name: LCR gallery JPG to PNG then WebP - one-time conversion

on:
  push:
    branches:
      - feat/about-gallery-png-webp-20261117

permissions:
  contents: read

concurrency:
  group: about-gallery-png-webp-conversion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout existing branch
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/migrate_about_gallery_jpg_png_webp.py

  convert:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/about-gallery-png-webp-20261117' && contains(github.event.head_commit.message, 'lcr-gallery-apply-authorized-20261117')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check protected secret exists
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing GitHub Actions SUPABASE_SERVICE_ROLE_KEY; no images were altered."
            exit 1
          fi
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Pillow
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-migration.txt
      - name: Strict sequence - 12 PNG files first, then 12 WebP files
        run: python scripts/migrate_about_gallery_jpg_png_webp.py apply --report gallery-apply.json
      - name: Independently read back 24 files and check 12 originals
        run: python scripts/migrate_about_gallery_jpg_png_webp.py verify --report gallery-verify.json
      - name: Publish audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-jpg-png-webp-audit
          retention-days: 30
          if-no-files-found: warn
          path: |
            gallery-apply.json
            gallery-verify.json
