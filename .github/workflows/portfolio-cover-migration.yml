name: LCR migration source validation — migrate_portfolio_covers.py
on:
  pull_request:
    branches: [main]
    paths:
      - 'code/scripts/migrate_portfolio_covers.py'
      - '.github/workflows/portfolio-cover-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: code

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile migration source without contacting any backend
        run: python3 -m py_compile scripts/migrate_portfolio_covers.py
      - name: Record integration status
        run: echo "Real migration and read-back suspended; separate authorization and budget required."
