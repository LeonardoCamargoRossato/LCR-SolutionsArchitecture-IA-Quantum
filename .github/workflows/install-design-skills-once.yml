name: LCR One-time design skills snapshot installer

on:
  push:
    branches: [chore/install-design-skills]
    paths: ['.github/workflows/install-design-skills-once.yml']

permissions:
  contents: write

jobs:
  vendor-pinned-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated installation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch pinned official source trees and copy without executing them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess, tempfile

          ROOT = Path.cwd()
          destination = ROOT / ".agents" / "skills"
          assert not destination.exists(), "Refusing to overwrite an existing skill installation"
          sources = {
              "frontend-design": (
                  "anthropics/skills",
                  "e4bb5d960d87126ff3b3a8af1a104b7db67560ba",
                  "skills/frontend-design",
              ),
              "ui-ux-pro-max": (
                  "nextlevelbuilder/ui-ux-pro-max-skill",
                  "6ec2bb58334ca3014573c4cbd4834ee3a40afd9d",
                  ".claude/skills/ui-ux-pro-max",
              ),
              "impeccable": (
                  "pbakaus/impeccable",
                  "b49177d32788f2dc585c42831d845dacf1ebed2c",
                  ".agents/skills/impeccable",
              ),
              "web-design-guidelines": (
                  "vercel-labs/agent-skills",
                  "5a37a6329fbad3666c3207392a6a7c0110e92efb",
                  "skills/web-design-guidelines",
              ),
              "vercel-rules-license": (
                  "vercel-labs/web-interface-guidelines",
                  "434b7f91364665f2f733b310ec54809bf8f37937",
                  "",
              ),
          }
          def run(*args):
              subprocess.run(args, check=True)
          with tempfile.TemporaryDirectory(prefix="lcr-skills-") as work:
              scratch = Path(work)
              for name, (repository, sha, source_path) in sources.items():
                  clone = scratch / name
                  url = "https://github.com/" + repository + ".git"
                  run("git", "init", "-q", str(clone))
                  run("git", "-C", str(clone), "remote", "add", "origin", url)
                  run("git", "-C", str(clone), "fetch", "-q", "--depth=1", "--no-tags", "origin", sha)
                  run("git", "-C", str(clone), "checkout", "-q", "--detach", "FETCH_HEAD")
                  actual = subprocess.check_output(["git", "-C", str(clone), "rev-parse", "HEAD"], text=True).strip()
                  if actual != sha:
                      raise RuntimeError(f"Unexpected upstream commit for {name}: {actual}")
                  sources[name] = (repository, sha, source_path, clone)

              for slug in ("frontend-design", "ui-ux-pro-max", "impeccable", "web-design-guidelines"):
                  repository, sha, source_path, clone = sources[slug]
                  original = clone / source_path
                  if not original.is_dir():
                      raise FileNotFoundError(original)
                  for current, dirs, files in os.walk(original, followlinks=False):
                      for entry in dirs + files:
                          if (Path(current) / entry).is_symlink():
                              raise RuntimeError(f"Unsafe source symlink: {slug}/{entry}")
                  shutil.copytree(original, destination / slug)
                  print(f"Copied pinned skill {slug} @ {sha} from {repository}")

              shutil.copy2(sources["ui-ux-pro-max"][3] / "LICENSE", destination / "ui-ux-pro-max/LICENSE")
              shutil.copy2(sources["impeccable"][3] / "LICENSE", destination / "impeccable/LICENSE")
              shutil.copy2(sources["impeccable"][3] / "NOTICE.md", destination / "impeccable/NOTICE.md")
              shutil.copy2(sources["vercel-rules-license"][3] / "LICENSE", destination / "web-design-guidelines/LICENSE")
              # Frontend Design carries its own per-skill Apache 2.0 LICENSE.txt.

              # Exact local-path adaptation; no other upstream instructions are edited.
              local_skill = destination / "ui-ux-pro-max/SKILL.md"
              original_text = local_skill.read_text(encoding="utf-8")
              upstream_prefix = chr(36) + "{CLAUDE_PLUGIN_ROOT}/.claude/skills/ui-ux-pro-max/"
              fixed_prefix = ".agents/skills/ui-ux-pro-max/"
              count = original_text.count(upstream_prefix)
              if count < 5:
                  raise RuntimeError(f"Unexpected upstream skill path count: {count}")
              local_skill.write_text(original_text.replace(upstream_prefix, fixed_prefix), encoding="utf-8")
              print(f"Adapted {count} Claude-specific command paths to local project paths")

              for slug in ("frontend-design", "ui-ux-pro-max", "impeccable", "web-design-guidelines"):
                  files = [p for p in (destination / slug).rglob("*") if p.is_file()]
                  print(f"Inventory {slug}: {len(files)} files, {sum(p.stat().st_size for p in files):,} bytes")

          PY

      - name: Validate exact files, licenses and reference integrity
        run: python3 docs/design-skills/validate_install.py

      - name: Commit vendored skills and remove this one-time privileged workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-design-skills-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .agents/skills .github/workflows/install-design-skills-once.yml
          # Vendored upstream text intentionally retains original whitespace.
          # Check only our temporary workflow removal, not third-party snapshots.
          git diff --cached --check -- .github/workflows/install-design-skills-once.yml
          git commit -m "chore(design): vendor four pinned design skills and remove one-time installer"
          git push origin HEAD:refs/heads/chore/install-design-skills
