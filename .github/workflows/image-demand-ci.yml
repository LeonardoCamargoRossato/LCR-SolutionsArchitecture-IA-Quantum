name: LCR demand-driven image QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/image-demand*'
      - '.github/workflows/image-demand-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-demand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compile baseline
        run: npm run test:isolated -- npm run build
      - name: Record baseline network and screenshots
        run: npm run test:isolated -- node tests/image-demand-smoke.mjs --baseline
      - name: Inventory image surfaces
        run: |
          mkdir -p test-results/image-demand
          git grep -n -E '<img|<picture|<source|srcSet|backgroundImage|background-image|new Image\\(|rel=.preload|url\\(' -- src index.html > test-results/image-demand/source-inventory.txt || test "$?" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-demand-baseline
          path: test-results/
          retention-days: 30
          if-no-files-found: error
