name: LCR Portal V2 — performance hotfix comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - 'code/vite.config.ts'
      - 'code/src/components/loading-portal/v2/**'
      - 'code/src/features/home-loading/**'
      - 'code/tests/portal-performance-hotfix*'
      - '.github/workflows/portal-performance-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: code

jobs:
  hotfix-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Prepare builds from each revision's locked dependencies
        run: |
          git worktree add --detach /tmp/lcr-before 67b4ad471c1ced8790286f6f87d2647bcd9163e0
          git worktree add --detach /tmp/lcr-after HEAD
          (cd /tmp/lcr-before && npm ci)
          ln -s "$PWD/node_modules" /tmp/lcr-after/code/node_modules
          for dir in /tmp/lcr-before /tmp/lcr-after/code; do
            node tests/portal-performance-hotfix-instrument.mjs "$dir"
            bash tests/isolation/run.sh bash -c 'cd "$1" && npm run build' bash "$dir"
          done
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare V2 before and after with render counts and trace
        env:
          LCR_BEFORE: /tmp/lcr-before
          LCR_AFTER: /tmp/lcr-after/code
        run: bash tests/isolation/run.sh node tests/portal-performance-hotfix-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-performance-hotfix-evidence
          path: code/test-results/portal-performance-hotfix.json
          retention-days: 30
