name: Cities Comparing visual alignment - PR #7

on:
  push:
    branches:
      - fix/cities-carousel-scrollbar-alignment-20261117
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - '.github/workflows/cities-carousel-layout-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  validate-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Verify TypeScript and production build
        run: bash tests/isolation/run.sh npm run build
      - name: Install browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate mobile and desktop layout
        run: bash tests/isolation/run.sh node tests/cities-carousel-alignment-smoke.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cities-carousel-layout-pr7
          path: code/test-results/
          retention-days: 30
          if-no-files-found: warn
