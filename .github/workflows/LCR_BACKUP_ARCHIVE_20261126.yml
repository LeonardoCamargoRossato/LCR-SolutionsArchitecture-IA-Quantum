name: LCR one-time version backup archive
on:
  pull_request:
    branches: [backup/versao-2026-11-26]
    paths: ['.github/workflows/LCR_BACKUP_ARCHIVE_20261126.yml']
  push:
    branches: [chore/backup-archive-20261126]
    paths: ['.github/workflows/LCR_BACKUP_ARCHIVE_20261126.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67e8877b02fc23352306f75c04a40f4085b1f716
          persist-credentials: false
      - name: Archive and verify exact stable tracked tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 67e8877b02fc23352306f75c04a40f4085b1f716
          mkdir -p "$RUNNER_TEMP/lcr-backup"
          git archive --format=zip --prefix=LCR-Portfolio/ -o "$RUNNER_TEMP/lcr-backup/LCR-Portfolio-2026-11-26.zip" HEAD
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, zipfile
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lcr-backup/LCR-Portfolio-2026-11-26.zip"
          expected = subprocess.check_output(["git", "ls-tree", "-r", "-z", "HEAD"]).split(b"\0")
          expected = {x.split(b"\t",1)[1].decode(): x.split(b"\t",1)[0].split()[2].decode() for x in expected if x}
          with zipfile.ZipFile(p) as z:
              actual = {n.removeprefix("LCR-Portfolio/") for n in z.namelist() if not n.endswith("/")}
              assert actual == set(expected), "Archive path mismatch"
              for name, sha in expected.items():
                  data = z.read("LCR-Portfolio/" + name)
                  assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == sha, name
              assert z.testzip() is None
          print(f"Verified {len(expected)} tracked files; ZIP {p.stat().st_size} bytes")
          PY
          cd "$RUNNER_TEMP/lcr-backup"
          sha256sum LCR-Portfolio-2026-11-26.zip > LCR-Portfolio-2026-11-26.zip.sha256
          sha256sum -c LCR-Portfolio-2026-11-26.zip.sha256
          printf '%s\n' '67e8877b02fc23352306f75c04a40f4085b1f716' > COMMIT.txt
      - name: Split archive for Drive connector transfer limit
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lcr-backup"
          split -b 75M -d -a 2 LCR-Portfolio-2026-11-26.zip LCR-Portfolio-2026-11-26.zip.part-
          test -f LCR-Portfolio-2026-11-26.zip.part-00
          test -f LCR-Portfolio-2026-11-26.zip.part-01
          test ! -f LCR-Portfolio-2026-11-26.zip.part-02
          cat LCR-Portfolio-2026-11-26.zip.part-00 LCR-Portfolio-2026-11-26.zip.part-01 | cmp - LCR-Portfolio-2026-11-26.zip
          sha256sum LCR-Portfolio-2026-11-26.zip.part-* > PARTS.sha256
          sha256sum -c PARTS.sha256
          printf '%s\n' 'Extract both artifact ZIPs into the same folder, then run:' 'sha256sum -c PARTS.sha256' 'cat LCR-Portfolio-2026-11-26.zip.part-00 LCR-Portfolio-2026-11-26.zip.part-01 > LCR-Portfolio-2026-11-26.zip' 'sha256sum -c LCR-Portfolio-2026-11-26.zip.sha256' > RESTORE.txt
          for part in 00 01; do
            mkdir "$part"
            cp "LCR-Portfolio-2026-11-26.zip.part-$part" COMMIT.txt PARTS.sha256 LCR-Portfolio-2026-11-26.zip.sha256 RESTORE.txt "$part/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: LCR-Portfolio-Backup-2026-11-26-part-01
          path: ${{ runner.temp }}/lcr-backup/00/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LCR-Portfolio-Backup-2026-11-26-part-02
          path: ${{ runner.temp }}/lcr-backup/01/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
