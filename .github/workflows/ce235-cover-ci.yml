name: CE235 website screenshot cover - build and browser checks

on:
  push:
    branches:
      - feat/ce235-site-screenshot-cover-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ce235-cover-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_MEDIA_BUCKET: ${{ secrets.VITE_SUPABASE_MEDIA_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate source PNG and WebP assets
        run: node tests/ce235-cover-assets.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Install headless browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: CE235 home card + case carousel (desktop/mobile)
        run: node tests/ce235-cover-browser-smoke.mjs
      - name: Preserve screenshots and test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce235-cover-evidence
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
