name: LCR Gallery PNG/WebP - validation

on:
  push:
    branches:
      - feat/about-gallery-png-webp-20261117
  pull_request:
    branches: [main]
    paths:
      - 'tests/isolation/**'
      - '.github/workflows/about-gallery-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-build:
    name: Build + resolver tests + gallery browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build TypeScript and Vite
        run: bash tests/isolation/run.sh npm run build
      - name: Test central URL resolver without browser
        run: bash tests/isolation/run.sh node tests/about-gallery-media.test.mjs
      - name: Install Playwright for CI only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test carousel WebP + zoom PNG on desktop and mobile
        run: bash tests/isolation/run.sh node tests/about-gallery-png-webp-smoke.mjs
      - name: Preserve screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-gallery-browser-evidence
          retention-days: 30
          if-no-files-found: warn
          path: test-results/
