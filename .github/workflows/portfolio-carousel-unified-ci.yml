name: LCR Standard Structures - shared project carousel and aligned hero

on:
  push:
    branches:
      - fix/lcr-carousel-thumbnail-autocenter-20261117
  pull_request:
    branches:
      - main
    paths:
      - code/src/components/case/CaseHero.tsx
      - code/src/estruturas-padroes/**
      - code/src/main.tsx
      - code/docs/adr/**
      - code/src/styles/global.css
      - code/tests/cities-carousel-alignment-smoke.mjs
      - code/tests/portfolio-carousel-unified-smoke.mjs
      - .github/workflows/portfolio-carousel-unified-ci.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  validate-all-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install exact project dependencies
        run: npm ci
      - name: TypeScript and production build
        run: bash tests/isolation/run.sh npm run build
      - name: Install browser testing tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regression - Cities Comparing
        run: bash tests/isolation/run.sh node tests/cities-carousel-alignment-smoke.mjs
      - name: All published portfolio project carousels - desktop and mobile
        run: bash tests/isolation/run.sh node tests/portfolio-carousel-unified-smoke.mjs
      - name: Save screenshots and project-by-project JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-standard-project-carousel
          path: code/test-results/
          retention-days: 30
          if-no-files-found: warn
