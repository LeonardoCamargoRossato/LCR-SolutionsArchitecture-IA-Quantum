name: Portfolio cover browser smoke - desktop mobile admin

on:
  push:
    branches:
      - feat/portfolio-cover-webp-20261117
  pull_request:
    branches: [main]
    paths:
      - 'tests/isolation/**'
      - '.github/workflows/portfolio-cover-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application
        run: npm ci
      - name: TypeScript and Vite build
        run: bash tests/isolation/run.sh npm run build
      - name: Install pinned Playwright for CI only
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser checks against live public CMS and Storage
        run: bash tests/isolation/run.sh node tests/portfolio-covers-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          if-no-files-found: warn
          retention-days: 30
          path: test-results/
