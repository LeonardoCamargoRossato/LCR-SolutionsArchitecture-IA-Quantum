name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize LCR Workflow diagram as WebP
        run: |
          python3 -m venv /tmp/lcr-webp
          /tmp/lcr-webp/bin/pip install --disable-pip-version-check Pillow
          /tmp/lcr-webp/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/workflow/LCR_Workflow_Agentes_Papeis_Funcoes.png")
          target = source.with_suffix(".webp")
          with Image.open(source) as image:
              image.save(target, "WEBP", quality=92, method=6)
          print(f"Workflow diagram: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes")
          # Retain the original PNG in Git history, but publish only the WebP.
          source.unlink()
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_MEDIA_BUCKET: ${{ secrets.VITE_SUPABASE_MEDIA_BUCKET }} 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4