name: LCR isolated manual regression — about-gallery-production-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  published-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published carousel WebP and PNG images
        run: bash tests/isolation/run.sh node tests/about-gallery-png-webp-smoke.mjs
      - name: Preserve local browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-production-browser-evidence
          retention-days: 30
          if-no-files-found: warn
          path: code/test-results/
