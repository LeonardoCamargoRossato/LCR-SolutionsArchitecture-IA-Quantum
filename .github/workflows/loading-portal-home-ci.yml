name: LCR Loading Portal — Real Home Boot & Performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - 'code/vite.config.ts'
      - 'code/src/features/home-loading/**'
      - 'code/src/components/loading-portal/**'
      - 'code/src/components/HeroTypeTitle.tsx'
      - 'code/src/components/hero/**'
      - 'code/src/hooks/useHomeEntrance.ts'
      - 'code/src/pages/Home.tsx'
      - 'code/src/RootRouteGate.tsx'
      - 'code/tests/home-loading-*.mjs'
      - '.github/workflows/loading-portal-home-ci.yml'
      - 'code/docs/home-loading/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  home-boot-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Compile TypeScript and build production bundles
        run: bash tests/isolation/run.sh npm run build
      - name: Audit portal and Home route separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/RootRouteGate.tsx').read_text()
          source = Path('src/features/home-loading/HomeBootCoordinator.tsx').read_text()
          preload = Path('src/features/home-loading/preloadCriticalResources.ts').read_text()
          home = Path('src/pages/Home.tsx').read_text()
          hero = Path('src/components/hero/InteractiveAiVisual.tsx').read_text()
          assert "location.pathname === '/test-component-lab'" in root
          assert 'HomeBootCoordinator' in root
          assert 'sessionStorage' in source
          assert 'portal' in source and 'homeSafe' in source and 'onOpened' in source
          assert 'waitForHomeDom' in preload and 'waitForHeroMedia' in preload
          assert 'waitForCanvas' in preload and 'confirmedBootProgress' in preload
          assert 'LoadingPortalV2' in source and 'onAssetState' in source
          assert 'requestAnimationFrame' not in source, 'No continuous progress loop'
          assert 'AbortController' in source and 'portal-fallback' in source
          assert 'VITE_SUPABASE' not in source and "from '../../infrastructure/supabase" not in preload
          assert 'useHomeMotionEnabled' in home and hero
          assert 'data-home-motion' in home
          assert Path('src/components/loading-portal/LoadingPortal.tsx').exists()
          assert Path('public/assets/home/loading-portal/portal-000.webp').exists()
          assert Path('public/assets/home/loading-portal/door-open-base.webp').exists() # historic V1
          assert Path('public/assets/home/loading-portal/mechanical/16x9/door-core.webp').exists()
          assert not list(Path('dist/assets').glob('*background-original.png'))
          print('PASS: runtime safe, Home is real, Lab isolated, approved assets preserved')
          PY
      - name: Install browser tests
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test first visit, readiness, CSS/Canvas motion synchronization, sessions, routes and safe fallback
        run: bash tests/isolation/run.sh node tests/home-loading-integration-smoke.mjs
      - name: Verify original Hero V13 particle wave on production-compatible route
        run: bash tests/isolation/run.sh node tests/hero-v13-particle-wave-smoke.mjs
      - name: Upload screenshots and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-loading-portal-home-boot-evidence
          path: code/test-results/
          retention-days: 30
          if-no-files-found: warn
