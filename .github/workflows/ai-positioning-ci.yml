name: LCR Portfolio - AI Engineering positioning regression

on:
  push:
    branches: [feat/ai-engineering-portfolio-positioning-20261122]
  pull_request:
    branches: [main]
    paths:
      - 'code/tests/isolation/**'
      - 'code/vite.config.ts'
      - code/src/**
      - code/index.html
      - code/tests/ai-positioning-smoke.mjs
      - .github/workflows/ai-positioning-ci.yml
      - code/docs/**
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck and build
        run: bash tests/isolation/run.sh npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Identity, case studies, hydration and ordering
        run: bash tests/isolation/run.sh node tests/ai-positioning-smoke.mjs
      - name: Existing carousel component regression
        run: bash tests/isolation/run.sh node tests/portfolio-carousel-unified-smoke.mjs
      - name: Evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcr-ai-engineering-portfolio
          path: code/test-results/
          if-no-files-found: warn
          retention-days: 30
