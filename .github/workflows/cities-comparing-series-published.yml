name: LCR isolated manual regression — cities-comparing-series-published

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-carousel:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout test source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check nine published slides on desktop and mobile
        run: bash tests/isolation/run.sh node tests/cities-comparing-series-carousel-smoke.mjs
      - name: Upload local screenshots and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cities-comparing-series-public-smoke
          retention-days: 30
          if-no-files-found: warn
          path: test-results/
