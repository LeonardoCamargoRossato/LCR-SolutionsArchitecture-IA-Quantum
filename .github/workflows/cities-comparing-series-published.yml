name: Cities Comparing - Published Series Compare audit

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-public-carousel:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CITIES_SMOKE_URL: https://leonardocamargorossato.github.io/LCR-SolutionsArchitecture-IA-Quantum/
    steps:
      - name: Checkout published main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check nine published slides on desktop and mobile
        run: node tests/cities-comparing-series-carousel-smoke.mjs
      - name: Upload production screenshots and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cities-comparing-series-public-smoke
          retention-days: 30
          if-no-files-found: warn
          path: test-results/
