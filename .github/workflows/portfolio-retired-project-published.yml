name: Portfolio - published retired-project smoke

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: read

jobs:
  published-projects:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTFOLIO_TEST_BASE_URL: https://leonardocamargorossato.github.io/LCR-SolutionsArchitecture-IA-Quantum/
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_MEDIA_BUCKET: ${{ secrets.VITE_SUPABASE_MEDIA_BUCKET }}
    steps:
      - name: Checkout published main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser tests
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify retired card and page absent, remaining cases work
        run: node tests/portfolio-covers-smoke.mjs
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-retirement-published-evidence
          retention-days: 30
          if-no-files-found: warn
          path: test-results/
