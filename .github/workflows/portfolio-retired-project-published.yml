name: LCR isolated manual regression — portfolio-retired-project-published

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  published-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout test source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install browser tests
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify retired card and page absent, remaining cases work
        run: bash tests/isolation/run.sh node tests/portfolio-covers-smoke.mjs
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-retirement-published-evidence
          retention-days: 30
          if-no-files-found: warn
          path: code/test-results/
