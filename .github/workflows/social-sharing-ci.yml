name: LCR Social Sharing — Static Open Graph QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'code/index.html'
      - 'code/src/components/SeoSync.tsx'
      - 'code/tests/ai-positioning-smoke.mjs'
      - 'code/public/og-cover.svg'
      - 'code/public/assets/branding/social/**'
      - 'code/docs/branding/**'
      - 'code/tests/social-sharing-smoke.py'
      - 'code/scripts/generate-mobile-social-preview.py'
      - '.github/workflows/social-sharing-ci.yml'
      - '.github/workflows/deploy.yml'
      - 'code/vite.config.ts'
      - 'code/package*.json'
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the already-deployed main preview over HTTPS
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: code

jobs:
  static-social-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: bash tests/isolation/run.sh npm run build
      - run: bash tests/isolation/run.sh python3 tests/social-sharing-smoke.py --dist dist
      - name: Preserve legacy SVG source
        run: git show dc7bc88c709ef46ea039e47c4d5c08630420df19:public/og-cover.svg | cmp - public/og-cover.svg
      - uses: actions/upload-artifact@v4
        with:
          name: social-sharing-preview
          path: |
            code/dist/index.html
            code/dist/assets/branding/social/lcr-portfolio-og-wa.jpg
            code/dist/assets/branding/social/lcr-portfolio-og-wa.webp
            code/dist/assets/branding/social/lcr-portfolio-og.jpg
            code/dist/assets/branding/social/lcr-portfolio-og.png
            code/dist/assets/branding/social/lcr-portfolio-og.webp
            code/docs/branding/SOCIAL_ASSET_INVENTORY.json
          retention-days: 30
      - name: Verify deployed crawler-facing HTML and image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_live
        run: python3 tests/isolation/PublishedSmoke.py
