name: LCR isolated manual regression — institution-logos-published

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  public-logos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify all eleven published institution logos, sizing and fallback
        run: bash tests/isolation/run.sh node tests/institution-logos-browser-smoke.mjs
      - name: Preserve public-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institution-logos-published-evidence
          retention-days: 30
          if-no-files-found: warn
          path: code/test-results/
