<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">LCR Workflow structure preview</title>
<desc id="desc">Lightweight vector preview of the published LCR Workflow structure diagram.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#d9ebff"/></linearGradient></defs>
<rect width="720" height="1080" rx="30" fill="url(#bg2)"/>
<rect x="34" y="34" width="10" height="58" rx="5" fill="#198cff"/>
<text x="64" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#081d4f">LCR Workflow</text>
<text x="64" y="99" font-family="Arial,sans-serif" font-size="14" fill="#2c4266">Estrutura base para organizar, iniciar e evoluir projetos web</text>
<g font-family="Arial,sans-serif"><rect x="34" y="132" width="202" height="142" rx="16" fill="#fff" stroke="#a9c7e7"/><text x="54" y="165" font-size="18" font-weight="700" fill="#0d2b58">Objetivo</text><text x="54" y="192" font-size="12" fill="#455b7a">Padronizar desenvolvimento,</text><text x="54" y="211" font-size="12" fill="#455b7a">documentação, automação e</text><text x="54" y="230" font-size="12" fill="#455b7a">continuidade dos projetos.</text><text x="54" y="255" font-size="11" font-weight="700" fill="#2878c8">Planejamento → Desenvolvimento → Evolução</text>
<rect x="254" y="132" width="432" height="142" rx="16" fill="#0d4f83"/><text x="278" y="166" font-size="19" font-weight="700" fill="#fff">Papéis especializados</text><g font-size="12" fill="#e5f3ff"><text x="278" y="194">Planner — objetivos, escopo e arquitetura</text><text x="278" y="215">Builder — código, integrações e ajustes</text><text x="278" y="236">Research / Drawer / Audio Designer</text><text x="278" y="257">Quality &amp; Security Auditor — qualidade e conformidade</text></g>
<rect x="34" y="294" width="652" height="182" rx="16" fill="#fff" stroke="#a9c7e7"/><rect x="34" y="294" width="652" height="44" rx="16" fill="#0d4f83"/><text x="58" y="322" font-size="18" font-weight="700" fill="#fff">Integrações principais</text><g font-size="13"><text x="58" y="366" font-weight="700" fill="#153d69">GitHub</text><text x="200" y="366" fill="#455b7a">Hospedagem, versão, issues, CI/CD e Pages</text><text x="58" y="397" font-weight="700" fill="#153d69">Supabase</text><text x="200" y="397" fill="#455b7a">Banco, Auth, Storage e serviços backend</text><text x="58" y="428" font-weight="700" fill="#153d69">Google</text><text x="200" y="428" fill="#455b7a">Login e monitoramento SEO</text><text x="58" y="459" font-weight="700" fill="#153d69">APIs externas</text><text x="200" y="459" fill="#455b7a">Integrações adicionadas conforme o projeto</text></g>
<rect x="34" y="496" width="652" height="388" rx="16" fill="#fff" stroke="#a9c7e7"/><rect x="34" y="496" width="652" height="44" rx="16" fill="#0d4f83"/><text x="58" y="524" font-size="18" font-weight="700" fill="#fff">Estrutura final do repositório</text><g fill="#e8f3ff" stroke="#8eb7df"><rect x="58" y="570" width="190" height="35" rx="7"/><rect x="58" y="617" width="190" height="35" rx="7"/><rect x="58" y="664" width="190" height="35" rx="7"/><rect x="58" y="711" width="190" height="35" rx="7"/><rect x="58" y="758" width="190" height="35" rx="7"/></g><g font-size="12" font-weight="700" fill="#153d69"><text x="72" y="592">.github/workflows/</text><text x="72" y="639">code/src/public/assets</text><text x="72" y="686">tests/ · scripts/</text><text x="72" y="733">supabase/ (opcional)</text><text x="72" y="780">documentation/</text></g><rect x="278" y="570" width="378" height="223" rx="10" fill="#edf5ff"/><text x="296" y="595" font-size="14" font-weight="700" fill="#153d69">Pastas dos agentes</text><text x="296" y="620" font-size="12" fill="#455b7a">planner · builder · research · drawer</text><text x="296" y="642" font-size="12" fill="#455b7a">audio-designer · quality-security-auditor</text><text x="296" y="680" font-size="14" font-weight="700" fill="#153d69">Registros</text><text x="296" y="705" font-size="12" fill="#455b7a">daily_summary.md · raw_data.json · data.json</text><text x="296" y="743" font-size="14" font-weight="700" fill="#153d69">Documentação principal</text><text x="296" y="768" font-size="12" fill="#455b7a">LCR_WORKFLOW.md · LCR_START.md · BASIC_SKILLS.md</text>
<rect x="34" y="906" width="652" height="124" rx="16" fill="#edf6ff" stroke="#a9c7e7"/><text x="58" y="938" font-size="18" font-weight="700" fill="#0d2b58">Decision Archive (ADR)</text><text x="58" y="965" font-size="12" fill="#455b7a">Registra decisão, contexto, justificativa, impactos e status.</text><text x="58" y="989" font-size="12" fill="#455b7a">Garante rastreabilidade, facilita manutenção e evita decisões repetidas.</text><text x="58" y="1014" font-size="12" font-weight="700" fill="#2878c8">Resultado: projeto organizado, reutilizável e pronto para evoluir.</text></g>
</svg>