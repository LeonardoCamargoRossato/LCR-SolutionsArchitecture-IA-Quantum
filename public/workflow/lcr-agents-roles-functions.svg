<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1767a7"/><stop offset="1" stop-color="#06356f"/></linearGradient>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#0b1d3a}.muted{fill:#30455f}.blue{fill:#0878ff}.card{fill:#fff;stroke:#7bb8f5;stroke-width:2}.pill{fill:#e8f3ff}.line{stroke:#0c63b8;stroke-width:4;fill:none;marker-end:url(#a)}.h{font-weight:800}.s{font-size:22px}.m{font-size:25px}.l{font-size:38px}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#0c63b8"/></marker>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect x="50" y="30" width="8" height="70" rx="4" fill="#0878ff"/>
  <text x="82" y="72" class="t h" font-size="54">LCR Workflow — Agentes, Papéis e Funções</text>
  <text x="82" y="110" class="t muted" font-size="22">Agentes especializados atuando de forma orquestrada para planejar, construir, validar e publicar soluções.</text>

  <rect x="14" y="170" width="482" height="126" rx="22" class="card"/>
  <text x="135" y="214" class="t h l">Planner</text><text x="135" y="250" class="t muted s">Define objetivos, escopo, requisitos,</text><text x="135" y="278" class="t muted s">roteiro e critérios de sucesso.</text>
  <rect x="350" y="188" width="126" height="36" rx="18" class="pill"/><text x="373" y="213" class="t h" font-size="18">Planejamento</text>

  <rect x="14" y="323" width="482" height="126" rx="22" class="card"/>
  <text x="135" y="367" class="t h l">Research</text><text x="135" y="403" class="t muted s">Pesquisa, valida referências, avalia</text><text x="135" y="431" class="t muted s">alternativas e sustenta decisões técnicas.</text>
  <rect x="366" y="341" width="110" height="36" rx="18" class="pill"/><text x="394" y="366" class="t h" font-size="18">Pesquisa</text>

  <rect x="14" y="476" width="482" height="126" rx="22" class="card"/>
  <text x="135" y="520" class="t h l">Drawer</text><text x="135" y="556" class="t muted s">Cria e organiza diagramas, UI/UX,</text><text x="135" y="584" class="t muted s">ícones e materiais de apoio.</text>
  <rect x="337" y="494" width="139" height="36" rx="18" class="pill"/><text x="353" y="519" class="t h" font-size="18">Recursos visuais</text>

  <rect x="1040" y="170" width="482" height="126" rx="22" class="card"/>
  <text x="1150" y="214" class="t h l">Builder / Codex</text><text x="1150" y="250" class="t muted s">Desenvolve a solução, integra componentes,</text><text x="1150" y="278" class="t muted s">aplica padrões e documenta alterações.</text>

  <rect x="1040" y="323" width="482" height="126" rx="22" class="card"/>
  <text x="1150" y="367" class="t h l">Audio Designer</text><text x="1150" y="403" class="t muted s">Produz e edita recursos sonoros quando</text><text x="1150" y="431" class="t muted s">aplicável: narração, efeitos e trilhas.</text>

  <rect x="1040" y="476" width="482" height="126" rx="22" class="card"/>
  <text x="1150" y="520" class="t h" font-size="32">Quality &amp; Security Auditor</text><text x="1150" y="556" class="t muted s">Testes, revisão de qualidade, segurança,</text><text x="1150" y="584" class="t muted s">SEO e conformidade com guardrails.</text>

  <rect x="550" y="132" width="436" height="106" rx="28" class="card"/>
  <text x="650" y="174" class="t h" font-size="31">Humano (Você)</text>
  <text x="650" y="207" class="t muted s">Define prioridades e aprova decisões nos gates.</text>

  <rect x="600" y="310" width="336" height="235" rx="44" fill="url(#hub)"/>
  <text x="768" y="414" text-anchor="middle" fill="#fff" font-family="Arial" font-size="40" font-weight="800">Orquestração</text>
  <text x="768" y="459" text-anchor="middle" fill="#fff" font-family="Arial" font-size="40" font-weight="800">LCR</text>
  <text x="768" y="501" text-anchor="middle" fill="#d8ecff" font-family="Arial" font-size="20">Coordena agentes, fluxo, gates</text>
  <text x="768" y="529" text-anchor="middle" fill="#d8ecff" font-family="Arial" font-size="20">e ciclos de retorno.</text>

  <path d="M550 211 C520 240 520 350 600 370" class="line"/><path d="M496 385 C540 385 560 402 600 402" class="line"/><path d="M496 540 C540 540 560 455 600 445" class="line"/>
  <path d="M986 211 C1016 240 1016 350 936 370" class="line"/><path d="M1040 385 C996 385 976 402 936 402" class="line"/><path d="M1040 540 C996 540 976 455 936 445" class="line"/>
  <path d="M768 238 L768 310" class="line"/>

  <rect x="8" y="664" width="460" height="326" rx="24" class="card"/>
  <rect x="8" y="664" width="460" height="54" rx="24" fill="#084b86"/><text x="42" y="700" fill="#fff" font-family="Arial" font-size="27" font-weight="800">Gates de Aprovação Humana</text>
  <text x="38" y="755" class="t h m">G1  Planejamento aprovado</text>
  <text x="38" y="807" class="t h m">G2  Solução implementada</text>
  <text x="38" y="859" class="t h m">G3  Qualidade validada</text>
  <text x="38" y="911" class="t h m">G4  Publicação autorizada</text>

  <rect x="486" y="664" width="620" height="326" rx="24" class="card"/>
  <rect x="486" y="664" width="620" height="54" rx="24" fill="#084b86"/><text x="520" y="700" fill="#fff" font-family="Arial" font-size="27" font-weight="800">Ciclo de Trabalho — visão geral</text>
  <text x="527" y="790" class="t h m">Planejar → Construir → Verificar → Corrigir → Publicar</text>
  <path d="M545 842 C650 930 930 930 1048 842" stroke="#0878ff" stroke-width="5" fill="none"/>
  <text x="796" y="930" text-anchor="middle" class="t h s">Ciclo de retorno / melhoria contínua</text>

  <rect x="1124" y="664" width="404" height="326" rx="24" class="card"/>
  <rect x="1124" y="664" width="404" height="54" rx="24" fill="#084b86"/><text x="1158" y="700" fill="#fff" font-family="Arial" font-size="27" font-weight="800">Resultados e Entregas</text>
  <text x="1160" y="760" class="t s">✓ Solução implementada e integrada</text>
  <text x="1160" y="805" class="t s">✓ Documentação técnica e de uso</text>
  <text x="1160" y="850" class="t s">✓ Qualidade, segurança e boas práticas</text>
  <text x="1160" y="895" class="t s">✓ Evidências e registro de decisão</text>
  <text x="1160" y="940" class="t s">✓ Publicação e liberação do resultado</text>
</svg>