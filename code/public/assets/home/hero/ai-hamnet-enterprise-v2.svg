<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="hamnet-title hamnet-desc">
<title id="hamnet-title">AI Hamnet — enterprise assistant</title>
<desc id="hamnet-desc">Original faceted graphite and blue technical AI assistant with an illuminated intelligence interface, restrained in a corporate style.</desc>
<defs>
<linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#314e71"/><stop offset=".46" stop-color="#142b4c"/><stop offset="1" stop-color="#08182f"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2e9ff"/><stop offset=".52" stop-color="#3696e9"/><stop offset="1" stop-color="#1a4274"/></linearGradient>
<linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102945"/><stop offset="1" stop-color="#030b1a"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#16b5ff" stop-opacity=".24"/><stop offset="1" stop-color="#16b5ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse cx="123" cy="129" rx="109" ry="115" fill="url(#halo)"/>
